name: flutter_tts
description: "A flutter plugin for Text to Speech.  This plugin is supported on iOS, macOS, Android, Web, & Windows."
version: 4.2.5
homepage: https://github.com/dlutton/flutter_tts

environment:
  sdk: ^3.3.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.eyedeadevelopment.fluttertts
        pluginClass: FlutterTtsPlugin
      ios:
        pluginClass: FlutterTtsPlugin
      macos:
        pluginClass: FlutterTtsPlugin
      windows:
        pluginClass: FlutterTtsPlugin
        supportedVariants:
          - uwp
          - win32
      web:
        pluginClass: FlutterTtsPlugin
        fileName: flutter_tts_web.dart
